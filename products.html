<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products - Freedom Habesha Dress</title>

<style>
body{
font-family:Arial;
background:#f6f6f6;
margin:0;
}

header{
background:#111;
color:#d4af37;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.card p{
margin:10px;
color:#444;
}

.price{
margin:10px;
font-weight:bold;
color:#d4af37;
}

button{
margin:10px;
width:calc(100% - 20px);
padding:10px;
background:#111;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#d4af37;
color:black;
}
</style>
</head>

<body>

<header>
Our Products
</header>

<div class="container" id="products">Loading products...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("products");

async function loadProducts(){
const snap = await getDocs(collection(db,"products"));

container.innerHTML = "";

snap.forEach(doc=>{
const p = doc.data();

container.innerHTML += `
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">ETB ${p.price}</div>
<button onclick="order('${p.name}')">Order Now</button>
</div>
`;
});
}

window.order = function(name){
localStorage.setItem("selectedProduct", name);
window.location.href = "order.html";
}

loadProducts();
</script>

</body>
</html>
