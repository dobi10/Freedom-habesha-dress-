<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - Freedom Habesha Dress</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#111;
color:#d4af37;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
background:#111;
color:white;
border:none;
padding:8px 12px;
margin-top:10px;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#d4af37;
color:black;
}
</style>
</head>

<body>

<header>
Freedom Habesha Admin Panel
</header>

<div class="container">

<div class="card">
<h3>Total Orders: <span id="total">0</span></h3>
</div>

<div id="orders">Loading orders...</div>

</div>

<script type="module">

if(localStorage.getItem("admin") !== "true"){
window.location.href = "login.html";
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ordersDiv = document.getElementById("orders");

async function loadOrders(){
const snap = await getDocs(collection(db,"orders"));

document.getElementById("total").innerText = snap.size;

ordersDiv.innerHTML = "";

snap.forEach((d)=>{
const data = d.data();

ordersDiv.innerHTML += `
<div class="card">
<h3>${data.name}</h3>
<p>📞 ${data.phone}</p>
<p>👗 ${data.product}</p>
<p>📏 ${data.size}</p>
<p>🔢 Qty: ${data.quantity}</p>
<p>📦 Status: ${data.status}</p>

<button onclick="deleteOrder('${d.id}')">Delete</button>
</div>
`;
});
}

window.deleteOrder = async function(id){
await deleteDoc(doc(db,"orders",id));
loadOrders();
}

loadOrders();
</script>

</body>
</html>
