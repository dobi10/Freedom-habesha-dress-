<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body{font-family:Arial;background:#f6f6f6;margin:0}
header{background:#111;color:#d4af37;padding:20px;text-align:center}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px}
button{padding:8px 12px;margin-top:10px;background:#111;color:white;border:none}
button:hover{background:#d4af37;color:black}
</style>
</head>

<body>

<header>Admin Dashboard</header>

<div class="container">

<h3>Total Orders: <span id="total">0</span></h3>

<div id="orders"></div>

</div>

<script type="module">

import {
db,collection,getDocs,deleteDoc,doc,updateDoc,onAuthStateChanged,auth
} from "./firebase.js";

onAuthStateChanged(auth,(user)=>{
if(!user) window.location.href="login.html";
});

const ordersDiv = document.getElementById("orders");

async function load(){
const snap = await getDocs(collection(db,"orders"));

document.getElementById("total").innerText = snap.size;

ordersDiv.innerHTML="";

snap.forEach(d=>{
const data = d.data();

ordersDiv.innerHTML += `
<div class="card">
<h3>${data.name}</h3>
<p>${data.phone}</p>
<p>${data.product}</p>
<p>Status: ${data.status}</p>

<button onclick="done('${d.id}')">Delivered</button>
<button onclick="del('${d.id}')">Delete</button>
</div>`;
});
}

window.del = async function(id){
await deleteDoc(doc(db,"orders",id));
load();
}

window.done = async function(id){
await updateDoc(doc(db,"orders",id),{
status:"Delivered"
});
load();
}

load();

</script>

</body>
</html>
