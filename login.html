<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Freedom Habesha Dress</title>

<style>
body{
font-family:Arial, sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:12px;
width:300px;
text-align:center;
}

h2{
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
background:#111;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#d4af37;
color:black;
}

#msg{
color:red;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input type="password" id="pass" placeholder="Enter admin password">

<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<script>
function login(){
const pass = document.getElementById("pass").value;

if(pass === "admin123"){
localStorage.setItem("admin","true");
window.location.href="admin.html";
}else{
document.getElementById("msg").innerText="Wrong password!";
}
}
</script>

</body>
</html>
