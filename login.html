<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{font-family:Arial;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:25px;width:300px;text-align:center;border-radius:10px}
input{width:100%;padding:10px;margin:10px 0}
button{width:100%;padding:10px;background:#111;color:white;border:none}
button:hover{background:#d4af37;color:black}
</style>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script type="module">

import { auth, signInWithEmailAndPassword } from "./firebase.js";

window.login = function(){

const email = document.getElementById("email").value;
const pass = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,pass)
.then(()=>{
window.location.href="admin.html";
})
.catch(()=>{
document.getElementById("msg").innerText="Login failed";
});
}

</script>

</body>
</html>
